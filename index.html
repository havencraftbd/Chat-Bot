<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HavenCraft Chat</title>
<script src="brain.js"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #0A0F14; color: #EADCC8; height: 100dvh;
    display: flex; justify-content: center; padding: 12px;
    overflow: hidden;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); z-index: 0; pointer-events: none; }
  .blob.teal { width: 320px; height: 320px; background: rgba(0, 200, 150, 0.25); top: -80px; left: -60px; }
  .blob.orange { width: 260px; height: 260px; background: rgba(255, 138, 0, 0.16); bottom: -60px; right: -40px; }
  .phone {
    position: relative; z-index: 1; width: 100%; max-width: 480px;
    background: rgba(255, 255, 255, 0.08);
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 28px; padding: 14px; overflow: hidden;
    display: flex; flex-direction: column; height: calc(100dvh - 24px);
  }
  .header { display: flex; align-items: center; gap: 10px; padding: 6px 6px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); flex-shrink: 0; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #00c896, #0F3D3E);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; color: #fff;
  }
  .name { font-size: 17px; font-weight: 600; }
  .status { font-size: 12px; color: #7FB3B8; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00c896; margin-right: 4px; }
  #chat { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px 4px; overflow-y: auto; scroll-behavior: smooth; }
  .msg {
    max-width: 82%; padding: 10px 14px; line-height: 1.5; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end; background: linear-gradient(135deg, #00c896, #00a87e); color: #fff;
    border-radius: 20px 20px 4px 20px;
  }
  .msg.bot {
    align-self: flex-start; background: rgba(255, 255, 255, 0.12);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.10); color: #EADCC8;
    border-radius: 20px 20px 20px 4px;
  }
  .msg.err { align-self: flex-start; background: rgba(255, 107, 107, 0.15); color: #ff9d9d; border-radius: 20px 20px 20px 4px; }
  .msg a { color: #9ADFFF; text-decoration: underline; }
  .msg.user a { color: #fff; }
  .inputbar { display: flex; gap: 8px; align-items: flex-end; padding-top: 4px; flex-shrink: 0; }
  #q {
    flex: 1; padding: 12px 16px; border-radius: 24px; font-size: 15px; line-height: 1.4;
    border: 1px solid rgba(255, 255, 255, 0.16); outline: none; resize: none;
    background: rgba(255, 255, 255, 0.10); color: #EADCC8;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    max-height: 120px; overflow-y: auto; scrollbar-width: none;
  }
  #q::-webkit-scrollbar { display: none; }
  #q::placeholder { color: #7FB3B8; }
  #send {
    width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 50%;
    background: #00c896; color: #0A0F14; font-size: 20px; font-weight: bold; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  /* Desktop: the 480px phone card looks lost on a wide screen, so widen + center it. */
  @media (min-width: 768px) {
    body { padding: 24px; }
    .phone { max-width: 760px; height: calc(100dvh - 48px); padding: 18px; }
    .msg { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="blob teal"></div>
<div class="blob orange"></div>
<div class="phone">
  <div class="header">
    <div class="avatar">H</div>
    <div>
      <div class="name">Haven</div>
      <div class="status"><span class="dot"></span>online · HavenCraft</div>
    </div>
  </div>

  <div id="chat"></div>

  <div class="inputbar">
    <textarea id="q" placeholder="Message..." autocomplete="off" rows="1"></textarea>
    <button id="send" aria-label="Send">↑</button>
  </div>
</div>

<script>
  const chatEl = document.getElementById("chat");
  const qEl = document.getElementById("q");
  const GENERIC_ERR = "Can't answer right now, please try again later.";
  // Key + model chain come from config.js (local-only file, never pushed).
  // If config.js is missing, KEY stays empty and the chat shows the generic error.
  const KEY = (typeof API_KEY !== "undefined") ? API_KEY : "";
  const MODEL_LIST = (typeof MODELS !== "undefined" && MODELS.length) ? MODELS : ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen3.8-27b"];

  // Conversation history: the model only remembers what we send it.
  // Keep the last turns so follow-ups ("already ticket", "that rank") make sense.
  // Page reload clears it — this test has no server-side session.
  const history = [];

  // Escape HTML first, then turn bare https:// URLs into clickable links.
  function renderText(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
    return escaped.replace(/https?:\/\/[^\s<]+/g, (url) => {
      const trail = url.match(/[.,;:!?)]+$/);
      const clean = trail ? url.slice(0, -trail[0].length) : url;
      const tail = trail ? trail[0] : "";
      return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>${tail}`;
    });
  }

  function addMsg(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.innerHTML = renderText(text);
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }

  // Input grows downward as you type (max ~120px), no visible scrollbar,
  // touch-scrollable inside when longer.
  function autoResize() {
    qEl.style.height = "auto";
    qEl.style.height = Math.min(qEl.scrollHeight, 120) + "px";
  }
  qEl.addEventListener("input", autoResize);

  async function ask(question) {
    if (!KEY) { addMsg(GENERIC_ERR, "err"); return; }
    addMsg(question, "user");
    const sendBtn = document.getElementById("send");
    sendBtn.disabled = true; qEl.disabled = true;
    try {
      // Try models in order. Switch ONLY on 429 (limit ended) — never on other errors,
      // and never when the answer is DON'T_KNOW (same brain, another model won't know either).
      // Nothing about switching is shown in the chat.
      let answer = null;
      let allRateLimited = false;
      for (let i = 0; i < MODEL_LIST.length; i++) {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + KEY },
          body: JSON.stringify({
            model: MODEL_LIST[i],
            messages: [
              { role: "system", content: buildSystemPrompt() },
              ...history.slice(-12),
              { role: "user", content: question },
            ],
            temperature: 0.3,
          }),
        });
        const data = await res.json();
        if (res.ok) { answer = (data.choices[0].message.content || "").trim(); break; }
        if (res.status !== 429) break;
        if (i === MODEL_LIST.length - 1) allRateLimited = true;
      }
      let displayText, displayCls;
      if (answer === null) {
        displayText = allRateLimited ? BUSY[detectLanguage(question)] : GENERIC_ERR;
        displayCls = allRateLimited ? "bot" : "err";
      } else if (answer.includes("DON'T_KNOW")) {
        // Robust: the model sometimes writes "(DON'T_KNOW)" inside a longer reply
        // instead of returning it alone — never let the token itself reach the visitor.
        displayText = FALLBACK[detectLanguage(question)];
        displayCls = "bot";
      } else {
        displayText = answer;
        displayCls = "bot";
      }
      addMsg(displayText, displayCls);
      if (displayCls === "bot") {
        history.push({ role: "user", content: question }, { role: "assistant", content: displayText });
      }
    } catch (e) {
      addMsg(GENERIC_ERR, "err");
    } finally {
      sendBtn.disabled = false; qEl.disabled = false; qEl.focus();
    }
  }

  document.getElementById("send").addEventListener("click", () => {
    const v = qEl.value.trim();
    if (!v) return;
    qEl.value = "";
    autoResize();
    ask(v);
  });
  // Enter sends, Shift+Enter adds a new line.
  qEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("send").click(); }
  });
</script>
</body>
</html>
